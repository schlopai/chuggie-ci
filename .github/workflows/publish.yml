# Build the image and publish it to ghcr.io/schlopai/chuggie-ci.
#
# Tagged with the Dockerfile's own content hash, so a consumer pins an exact image and a rebuild
# cannot silently change what their jobs run on. `latest` moves only from main, and is for looking
# at — not for pinning.
name: Publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Tag from the Dockerfile's content
        id: tag
        run: |
          h=$(sha256sum Dockerfile | cut -c1-12)
          echo "tag=$h" >> "$GITHUB_OUTPUT"
          echo "Image tag: $h"

      # Ask GHCR what it actually grants this token, rather than inferring it from a push failure.
      # The token endpoint returns a JWT whose `access` claim is the real answer.
      - name: What does GHCR grant us?
        env:
          T: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          for user in "${{ github.actor }}" "${{ github.repository_owner }}"; do
            echo "--- as $user"
            jwt=$(curl -sS -u "$user:$T" \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${{ github.repository_owner }}/chuggie-ci:pull,push" \
              | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))')
            [ -n "$jwt" ] || { echo "no token issued"; continue; }
            python3 - "$jwt" <<'EOF'
          import base64, json, sys
          p = sys.argv[1].split('.')[1]
          d = json.loads(base64.urlsafe_b64decode(p + '=' * (-len(p) % 4)))
          print('access:', json.dumps(d.get('access')))
          EOF
          done

      - uses: docker/setup-buildx-action@v3

      # GHCR_TOKEN if the org keeps GITHUB_TOKEN read-only, GITHUB_TOKEN if it does not. Either
      # unblocks the push, and whichever the org settles on needs no edit here:
      #
      #   - org allows write:  Settings > Actions > General > Workflow permissions > Read and write
      #     https://github.com/organizations/schlopai/settings/actions
      #   - or a PAT:          a classic token with write:packages, saved as GHCR_TOKEN
      #     gh secret set GHCR_TOKEN --repo schlopai/chuggie-ci
      - name: Log in to ghcr.io
        if: github.event.pull_request.head.repo.fork != true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      # A fork's PR builds without pushing — it has no registry write — so a broken Dockerfile still
      # fails there rather than on main.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event.pull_request.head.repo.fork != true }}
          tags: |
            ghcr.io/schlopai/chuggie-ci:${{ steps.tag.outputs.tag }}
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/schlopai/chuggie-ci:latest' || '' }}
          # No provenance/SBOM attestations. They add a second manifest that buildx has to read
          # back before writing, and that read is what GHCR refuses on a namespace with no package
          # in it yet: `denied: permission_denied: read_package`, even holding Packages: write.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say what to pin
        run: echo "::notice::Pin to ghcr.io/schlopai/chuggie-ci:${{ steps.tag.outputs.tag }}"
