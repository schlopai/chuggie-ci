# Build the image and publish it to ghcr.io/schlopai/chuggie-toolchain.
#
# Tagged with the Dockerfile's own content hash, so a consumer pins an exact image and a rebuild
# cannot silently change what their jobs run on. `latest` moves only from main, and is for looking
# at — not for pinning.
name: Publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Tag from the Dockerfile's content
        id: tag
        run: |
          h=$(sha256sum Dockerfile | cut -c1-12)
          echo "tag=$h" >> "$GITHUB_OUTPUT"
          echo "Image tag: $h"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event.pull_request.head.repo.fork != true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      # A fork's PR builds without pushing — it has no registry write — so a broken Dockerfile still
      # fails there rather than on main.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event.pull_request.head.repo.fork != true }}
          tags: |
            ghcr.io/schlopai/chuggie-toolchain:${{ steps.tag.outputs.tag }}
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/schlopai/chuggie-toolchain:latest' || '' }}
          # No provenance/SBOM attestations. They add a second manifest that buildx has to read
          # back before writing, and that read is what GHCR refuses on a namespace with no package
          # in it yet: `denied: permission_denied: read_package`, even holding Packages: write.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say what to pin
        run: echo "::notice::Pin to ghcr.io/schlopai/chuggie-toolchain:${{ steps.tag.outputs.tag }}"
